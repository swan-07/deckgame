<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Deck Game</title>
<style>
  :root {
    --red: #c0392b;
    --black: #1a1a1a;
    --bg: #0f5132;
    --bg-felt: #14693f;
    --card-bg: #fffdf7;
    --card-border: #d8d2bf;
    --info-bg: #1a1a1a;
    --info-fg: #fffdf7;
    --info-accent: #f4d35e;
    --shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(ellipse at center, var(--bg-felt) 0%, var(--bg) 80%);
    color: #fff;
    min-height: 100vh;
  }

  header {
    padding: 24px 32px 8px;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 1px;
  }

  main {
    padding: 24px 32px 48px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .suit-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .suit-header {
    font-size: 32px;
    margin-bottom: 8px;
    user-select: none;
  }

  .suit-header.red { color: var(--red); }
  .suit-header.black { color: #eee; }

  .card {
    width: 100%;
    max-width: 140px;
    aspect-ratio: 2.5 / 3.5;
    perspective: 1000px;
    cursor: pointer;
    user-select: none;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .card.flipped .card-inner,
  .card:focus-visible .card-inner {
    transform: rotateY(180deg);
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55);
  }

  @media (hover: hover) {
    .card:hover .card-inner {
      transform: rotateY(180deg);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55);
    }
  }

  .card-face,
  .card-info {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    overflow: hidden;
  }

  .card-face {
    background: var(--card-bg);
    color: var(--black);
  }

  .card-face.red { color: var(--red); }

  .card-info {
    transform: rotateY(180deg);
    background: var(--info-bg);
    color: var(--info-fg);
    border: 1px solid #333;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }

  .card-info .name {
    font-weight: 700;
    font-size: 12px;
    line-height: 1.2;
    color: var(--info-accent);
    margin-bottom: 4px;
    word-wrap: break-word;
  }

  .card-info .row {
    font-size: 10px;
    line-height: 1.25;
  }

  .card-info .row .label {
    display: block;
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .card-info .row .value {
    font-size: 11px;
    font-weight: 600;
  }

  .corner {
    position: absolute;
    font-weight: 700;
    line-height: 1;
    text-align: center;
  }

  .corner .rank { font-size: 16px; }
  .corner .suit { font-size: 16px; }

  .corner.tl { top: 6px; left: 8px; }
  .corner.br {
    bottom: 6px;
    right: 8px;
    transform: rotate(180deg);
  }

  .center-suit {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 44px;
    line-height: 1;
  }

  .face-letter {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: 700;
    font-family: "Times New Roman", serif;
    letter-spacing: -2px;
  }

  @media (max-width: 720px) {
    main { padding: 16px; gap: 12px; }
    h1 { font-size: 22px; }
    .corner .rank, .corner .suit { font-size: 12px; }
    .center-suit { font-size: 28px; }
    .face-letter { font-size: 32px; }
    .suit-header { font-size: 24px; }
    .card-info .name { font-size: 11px; }
    .card-info .row .label { font-size: 7px; }
    .card-info .row .value { font-size: 10px; }
  }
</style>
</head>
<body>
  <header><h1>The Deck Game</h1></header>
  <main id="board"></main>

  <script>
    const SUITS = [
      { name: "Spades",   symbol: "♠", color: "black" },
      { name: "Hearts",   symbol: "♥", color: "red" },
      { name: "Diamonds", symbol: "♦", color: "red" },
      { name: "Clubs",    symbol: "♣", color: "black" }
    ];

    const RANKS = [
      { short: "2",  name: "Two" },
      { short: "3",  name: "Three" },
      { short: "4",  name: "Four" },
      { short: "5",  name: "Five" },
      { short: "6",  name: "Six" },
      { short: "7",  name: "Seven" },
      { short: "8",  name: "Eight" },
      { short: "9",  name: "Nine" },
      { short: "10", name: "Ten" },
      { short: "J",  name: "Jack" },
      { short: "Q",  name: "Queen" },
      { short: "K",  name: "King" },
      { short: "A",  name: "Ace" }
    ];

    const FACE_LETTERS = new Set(["J", "Q", "K", "A"]);

    const board = document.getElementById("board");

    function buildCard(rank, suit) {
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;

      const inner = document.createElement("div");
      inner.className = "card-inner";

      const face = document.createElement("div");
      face.className = "card-face" + (suit.color === "red" ? " red" : "");

      const tl = document.createElement("div");
      tl.className = "corner tl";
      tl.innerHTML = `<div class="rank">${rank.short}</div><div class="suit">${suit.symbol}</div>`;

      const br = document.createElement("div");
      br.className = "corner br";
      br.innerHTML = `<div class="rank">${rank.short}</div><div class="suit">${suit.symbol}</div>`;

      face.append(tl, br);

      if (FACE_LETTERS.has(rank.short)) {
        const letter = document.createElement("div");
        letter.className = "face-letter";
        letter.textContent = rank.short;
        face.appendChild(letter);
      } else {
        const center = document.createElement("div");
        center.className = "center-suit";
        center.textContent = suit.symbol;
        face.appendChild(center);
      }

      const fullName = `${rank.name} of ${suit.name}`;
      const info = document.createElement("div");
      info.className = "card-info";
      info.innerHTML = `
        <div class="name">${fullName}</div>
        <div class="row"><span class="label">Winner</span><span class="value">TBA</span></div>
        <div class="row"><span class="label">Game</span><span class="value">TBA</span></div>
        <div class="row"><span class="label">Sponsor</span><span class="value">TBA</span></div>
      `;

      inner.append(face, info);
      card.appendChild(inner);

      card.addEventListener("click", () => toggleFlip(card));
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleFlip(card);
        }
      });

      return card;
    }

    let activeCard = null;
    function toggleFlip(card) {
      if (activeCard && activeCard !== card) {
        activeCard.classList.remove("flipped");
      }
      const willFlip = !card.classList.contains("flipped");
      card.classList.toggle("flipped", willFlip);
      activeCard = willFlip ? card : null;
    }

    SUITS.forEach(suit => {
      const col = document.createElement("div");
      col.className = "suit-column";

      const header = document.createElement("div");
      header.className = `suit-header ${suit.color}`;
      header.textContent = suit.symbol;
      col.appendChild(header);

      RANKS.forEach(rank => col.appendChild(buildCard(rank, suit)));

      board.appendChild(col);
    });
  </script>
</body>
</html>
